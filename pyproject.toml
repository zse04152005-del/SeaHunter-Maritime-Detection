[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seahunter-vis"
version = "0.1.0"
description = "Video-first maritime UAV perception and warning system"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "SeaHunter-VIS contributors" },
]
dependencies = []

[project.optional-dependencies]
video = [
  "numpy>=1.24,<2.3",
  "opencv-python>=4.8,<5",
]
edge = [
  "fastapi>=0.115,<1",
  "psutil>=5.9,<8",
  "uvicorn[standard]>=0.32,<1",
]
parquet = [
  "pyarrow>=16,<23",
]
tracking = [
  "numpy>=1.24,<2.3",
  "scipy>=1.10,<2",
]
legacy-detector = [
  "numpy>=1.24,<2.3",
  "opencv-python>=4.8,<5",
  "pillow>=9.5",
  "pyyaml>=6",
  "scipy>=1.10",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.65",
  "ultralytics==8.3.234",
]
export = [
  "onnx>=1.17,<=1.19.1",
  "onnxruntime>=1.20,<2",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
seahunter-baseline-audit = "seahunter.tools.baseline_audit:main"
seahunter-edge-service = "seahunter.tools.edge_service:main"
seahunter-video-replay = "seahunter.tools.video_replay:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["seahunter"]
