name: cloud-validation

on:
  push:
    branches: ["feature/**"]
    paths: [".github/workflows/cloud-validation.yml"]
  workflow_dispatch:
    inputs:
      suite:
        description: Cloud validation suite
        required: true
        default: legacy-detector
        type: choice
        options:
          - m0-governance
          - legacy-detector
          - m1-replay
          - m2-tracking
          - m2-evaluation
          - m2-gmc
          - all

permissions:
  contents: read

concurrency:
  group: cloud-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m0-governance:
    if: github.event_name == 'push' || inputs.suite == 'm0-governance' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install governance test environment
        run: uv sync --extra dev
      - name: Validate baseline and experiment matrix
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_baseline_integrity.py \
            tests/test_experiment_plan.py \
            --junitxml=reports/m0-governance.xml
          uv run python training/run_experiments.py \
            --config configs/experiments/m0_detector_nwd_ablation.json \
            --dry-run > reports/m0-detector-experiment-plan.json
      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-governance-reports
          path: reports/

  legacy-detector:
    if: github.event_name == 'push' || inputs.suite == 'legacy-detector' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install legacy CPU environment
        run: uv sync --extra dev --extra video --extra tracking --extra legacy-detector
      - name: Run original-weight CPU regression
        env:
          SEAHUNTER_RUN_MODEL_TESTS: "1"
        run: |
          mkdir -p reports
          uv run pytest tests/test_legacy_model.py \
            --junitxml=reports/legacy-detector.xml
      - name: Upload legacy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-detector-reports
          path: reports/

  m1-replay:
    if: github.event_name == 'push' || inputs.suite == 'm1-replay' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install replay environment
        run: uv sync --extra dev --extra video --extra edge --extra parquet --extra tracking
      - name: Run replay and edge-output integration
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_decoder_capabilities.py \
            tests/test_opencv_replay.py \
            tests/test_preview.py \
            tests/test_parquet_sink.py \
            tests/test_result_sinks.py \
            --junitxml=reports/m1-replay.xml
          uv run seahunter-decode-capabilities \
            --output reports/decoder-build-capabilities.json
      - name: Upload replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-replay-reports
          path: reports/

  m2-tracking:
    if: github.event_name == 'push' || inputs.suite == 'm2-tracking' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install tracking environment
        run: uv sync --extra dev --extra video --extra edge --extra tracking
      - name: Run ByteTrack baseline validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_bytetrack.py \
            tests/test_tracking_outputs.py \
            tests/test_tracking_visualization.py \
            tests/test_schemas.py \
            tests/test_edge_cli.py \
            --junitxml=reports/m2-tracking.xml
      - name: Upload tracking reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-tracking-reports
          path: reports/

  m2-evaluation:
    if: github.event_name == 'push' || inputs.suite == 'm2-evaluation' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install MOT evaluation environment
        run: uv sync --extra dev --extra evaluation
      - name: Run MOT evaluator tests
        run: |
          mkdir -p reports
          uv run pytest tests/test_mot_evaluation.py \
            --junitxml=reports/m2-evaluation.xml
      - name: Generate synthetic maritime MOT report
        run: |
          uv run seahunter-mot-evaluate \
            --ground-truth tests/fixtures/mot/synthetic-maritime-gt.txt \
            --predictions tests/fixtures/mot/synthetic-maritime-pred.txt \
            --sequence-name synthetic-maritime \
            --output reports/synthetic-maritime.metrics.json \
            --errors-output reports/synthetic-maritime.errors.json \
            --artifacts-dir reports/synthetic-maritime.trackeval
      - name: Upload MOT evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-evaluation-reports
          path: reports/

  m2-gmc:
    if: github.event_name == 'push' || inputs.suite == 'm2-gmc' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install BoT-SORT GMC environment
        run: uv sync --extra dev --extra video --extra tracking
      - name: Run BoT-SORT and GMC validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_global_motion.py \
            tests/test_botsort.py \
            tests/test_gmc_ablation.py \
            tests/test_edge_cli.py \
            tests/test_tracking_outputs.py \
            --junitxml=reports/m2-gmc.xml
      - name: Generate synthetic camera-pan ablation
        run: |
          uv run python evaluation/evaluate_gmc_ablation.py \
            --output reports/synthetic-camera-pan-gmc-ablation.json
      - name: Upload BoT-SORT GMC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-gmc-reports
          path: reports/
