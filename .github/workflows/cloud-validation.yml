name: cloud-validation

on:
  push:
    branches: ["feature/**"]
    paths: [".github/workflows/cloud-validation.yml"]
  workflow_dispatch:
    inputs:
      suite:
        description: Cloud validation suite
        required: true
        default: legacy-detector
        type: choice
        options:
          - m0-governance
          - legacy-detector
          - m1-replay
          - m2-tracking
          - m2-evaluation
          - m2-gmc
          - m2-motion-prior
          - m2-association
          - m2-reid
          - m2-recovery
          - m3-foundation
          - m3-geolocation
          - m4-events
          - m4-closure
          - all

permissions:
  contents: read

concurrency:
  group: cloud-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m0-governance:
    if: github.event_name == 'push' || inputs.suite == 'm0-governance' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install governance test environment
        run: uv sync --extra dev
      - name: Validate baseline and experiment matrix
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_baseline_integrity.py \
            tests/test_experiment_plan.py \
            --junitxml=reports/m0-governance.xml
          uv run python training/run_experiments.py \
            --config configs/experiments/m0_detector_nwd_ablation.json \
            --dry-run > reports/m0-detector-experiment-plan.json
      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-governance-reports
          path: reports/

  legacy-detector:
    if: github.event_name == 'push' || inputs.suite == 'legacy-detector' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install legacy CPU environment
        run: uv sync --extra dev --extra video --extra tracking --extra legacy-detector
      - name: Run original-weight CPU regression
        env:
          SEAHUNTER_RUN_MODEL_TESTS: "1"
        run: |
          mkdir -p reports
          uv run pytest tests/test_legacy_model.py \
            --junitxml=reports/legacy-detector.xml
      - name: Upload legacy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-detector-reports
          path: reports/

  m1-replay:
    if: github.event_name == 'push' || inputs.suite == 'm1-replay' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install replay environment
        run: uv sync --extra dev --extra video --extra edge --extra parquet --extra tracking
      - name: Run replay and edge-output integration
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_decoder_capabilities.py \
            tests/test_opencv_replay.py \
            tests/test_preview.py \
            tests/test_parquet_sink.py \
            tests/test_result_sinks.py \
            --junitxml=reports/m1-replay.xml
          uv run seahunter-decode-capabilities \
            --output reports/decoder-build-capabilities.json
      - name: Upload replay reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-replay-reports
          path: reports/

  m2-tracking:
    if: github.event_name == 'push' || inputs.suite == 'm2-tracking' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install tracking environment
        run: uv sync --extra dev --extra video --extra edge --extra tracking
      - name: Run ByteTrack baseline validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_bytetrack.py \
            tests/test_tracking_outputs.py \
            tests/test_tracking_visualization.py \
            tests/test_schemas.py \
            tests/test_edge_cli.py \
            --junitxml=reports/m2-tracking.xml
      - name: Upload tracking reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-tracking-reports
          path: reports/

  m2-evaluation:
    if: github.event_name == 'push' || inputs.suite == 'm2-evaluation' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install MOT evaluation environment
        run: uv sync --extra dev --extra evaluation
      - name: Run MOT evaluator tests
        run: |
          mkdir -p reports
          uv run pytest tests/test_mot_evaluation.py \
            --junitxml=reports/m2-evaluation.xml
      - name: Generate synthetic maritime MOT report
        run: |
          uv run seahunter-mot-evaluate \
            --ground-truth tests/fixtures/mot/synthetic-maritime-gt.txt \
            --predictions tests/fixtures/mot/synthetic-maritime-pred.txt \
            --sequence-name synthetic-maritime \
            --output reports/synthetic-maritime.metrics.json \
            --errors-output reports/synthetic-maritime.errors.json \
            --artifacts-dir reports/synthetic-maritime.trackeval
      - name: Upload MOT evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-evaluation-reports
          path: reports/

  m2-gmc:
    if: github.event_name == 'push' || inputs.suite == 'm2-gmc' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install BoT-SORT GMC environment
        run: uv sync --extra dev --extra video --extra tracking
      - name: Run BoT-SORT and GMC validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_global_motion.py \
            tests/test_botsort.py \
            tests/test_gmc_ablation.py \
            tests/test_edge_cli.py \
            tests/test_tracking_outputs.py \
            --junitxml=reports/m2-gmc.xml
      - name: Generate synthetic camera-pan ablation
        run: |
          uv run python evaluation/evaluate_gmc_ablation.py \
            --output reports/synthetic-camera-pan-gmc-ablation.json
      - name: Upload BoT-SORT GMC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-gmc-reports
          path: reports/

  m2-motion-prior:
    if: github.event_name == 'push' || inputs.suite == 'm2-motion-prior' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install telemetry motion environment
        run: uv sync --extra dev --extra tracking
      - name: Run telemetry prior and motion-fusion validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_telemetry_motion.py \
            tests/test_botsort.py \
            tests/test_schemas.py \
            tests/test_tracking_outputs.py \
            --junitxml=reports/m2-motion-prior.xml
      - name: Upload telemetry motion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-motion-prior-reports
          path: reports/

  m2-association:
    if: github.event_name == 'push' || inputs.suite == 'm2-association' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install hierarchical association environment
        run: uv sync --extra dev --extra tracking
      - name: Run motion-gated association validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_motion_association.py \
            tests/test_bytetrack.py \
            tests/test_tracking_outputs.py \
            tests/test_schemas.py \
            --junitxml=reports/m2-association.xml
      - name: Upload association reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-association-reports
          path: reports/

  m2-reid:
    if: github.event_name == 'push' || inputs.suite == 'm2-reid' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install appearance tracking environment
        run: uv sync --extra dev --extra tracking
      - name: Run ReID quality and tracklet-template validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_reid_quality.py \
            tests/test_botsort.py \
            tests/test_motion_association.py \
            tests/test_tracking_outputs.py \
            tests/test_edge_cli.py \
            --junitxml=reports/m2-reid.xml
      - name: Upload ReID reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-reid-reports
          path: reports/

  m2-recovery:
    if: github.event_name == 'push' || inputs.suite == 'm2-recovery' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install trajectory recovery environment
        run: uv sync --extra dev --extra tracking --extra video
      - name: Run interpolation, extrapolation, and audit validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_trajectory_recovery.py \
            tests/test_bytetrack.py \
            tests/test_tracking_outputs.py \
            tests/test_tracking_visualization.py \
            tests/test_schemas.py \
            tests/test_edge_cli.py \
            --junitxml=reports/m2-recovery.xml
      - name: Upload trajectory recovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-recovery-reports
          path: reports/

  m3-foundation:
    if: github.event_name == 'push' || inputs.suite == 'm3-foundation' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install M3 foundation environment
        run: uv sync --extra dev --extra tracking
      - name: Run calibration, transform, MAVLink, and synchronization validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_geometry_foundation.py \
            tests/test_telemetry_sync.py \
            tests/test_mavlink_adapter.py \
            tests/test_telemetry_motion.py \
            tests/test_schemas.py \
            --junitxml=reports/m3-foundation.xml
          uv run seahunter-calibration-audit \
            configs/geometry/camera.example.json \
            --output reports/camera-calibration-audit.json
      - name: Upload M3 foundation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-foundation-reports
          path: reports/

  m3-geolocation:
    if: github.event_name == 'push' || inputs.suite == 'm3-geolocation' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install geolocation environment
        run: uv sync --extra dev --extra tracking
      - name: Run sea-plane, uncertainty, EKF, trend, and TTC validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_geolocation.py \
            tests/test_geometry_foundation.py \
            tests/test_telemetry_sync.py \
            tests/test_schemas.py \
            --junitxml=reports/m3-geolocation.xml
      - name: Upload M3 geolocation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-geolocation-reports
          path: reports/

  m4-events:
    if: github.event_name == 'push' || inputs.suite == 'm4-events' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install event engine environment
        run: uv sync --extra dev
      - name: Run zone, hysteresis, rule, risk, and lifecycle validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_event_engine.py \
            tests/test_geofence.py \
            tests/test_schemas.py \
            --junitxml=reports/m4-events.xml
      - name: Upload M4 event reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-events-reports
          path: reports/

  m4-closure:
    if: github.event_name == 'push' || inputs.suite == 'm4-closure' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install event service environment
        run: uv sync --extra dev --extra edge
      - name: Run persistence, evidence, API, WebSocket, MQTT, and feedback validation
        run: |
          mkdir -p reports
          uv run pytest \
            tests/test_event_service.py \
            tests/test_event_evidence.py \
            tests/test_event_api.py \
            tests/test_event_engine.py \
            tests/test_geofence.py \
            --junitxml=reports/m4-closure.xml
      - name: Upload M4 closure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-closure-reports
          path: reports/
