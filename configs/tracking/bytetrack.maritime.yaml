schema_version: 1
tracker_type: bytetrack
implementation: seahunter.tracking.ByteTracker

# Framework-neutral M2 baseline. These keys map directly to ByteTrackConfig.
high_confidence_threshold: 0.60
low_confidence_threshold: 0.10
new_track_threshold: 0.70
first_match_iou_threshold: 0.30
second_match_iou_threshold: 0.20
max_lost_frames: 30
minimum_confirmed_hits: 1
frame_rate: 30.0
inferred_confidence_decay: 0.90
class_aware: true
emit_lost_predictions: false
motion_gating_enabled: true
# Chi-square 99% quantile for four measurement dimensions (cx, cy, w, h).
motion_gate_threshold: 13.276704

outputs:
  mot_include_inferred: false
  audit_jsonl: true
  audit_jsonl_schema_version: 5
  track_trail_length: 30
  trajectory_recovery:
    enabled: false
    maximum_interpolation_gap_frames: 3

# Starting values only: calibrate by target size, weather, camera motion, and source FPS
# on a leakage-free maritime MOT validation split before accepting the baseline.
