# SeaHunter V1 legacy architecture. Kept framework-neutral at the config layer,
# but currently parsed by the pinned Ultralytics 8.3.234 baseline fork.

nc: 5
scale: s
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, SPDConv, [256]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, SPDConv, [512]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, SPDConv, [1024]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, MultiSEAM, [1024]]
  - [-1, 1, EMA, [1024]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[19, 22, 25, 28], 1, Detect, [nc]]
